<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharkie</title>
    <link rel="icon" href="img/6.Favicon/sharkie.png" type="image/png" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="models/drawable-object.class.js"></script>
    <script src="models/moveable-object.class.js"></script>
    <script src="models/collectable.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/poison.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/bar-coin.class.js"></script>
    <script src="models/bar-health.class.js"></script>
    <script src="models/bar-poison.class.js"></script>
    <script src="models/backgorund-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/puffer-fish.class.js"></script>
    <script src="models/jelly-fish.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/bar-boss-health.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="models/world.class.js"></script>
    <script src="js/game.js"></script>
  </head>
  <body onload="init()">
    <div class="rotate-screen">
      <div class="rotate-content">
        <div class="rotate-icon">📱↻</div>
        <p>Bitte drehe dein Gerät ins Querformat</p>
      </div>
    </div>
    <div class="game-container">
      <div id="startScreen" class="start-screen">
        <img
          class="start-sharkie"
          src="img/1.Sharkie/1.IDLE/1.png"
          alt="sharkie"
        />
        <div class="start-buttons">
          <button class="menu-button" onclick="startGame()">PLAY</button>
          <button class="menu-button" onclick="showInstructions()">
            ANLEITUNG
          </button>
        </div>
      </div>
      <div id="gameOverScreen" class="game-over-screen d-none">
        <h2 id="gameOverTitle">GAME OVER</h2>

        <div class="game-over-buttons">
          <button class="menu-button" onclick="restartGame()">NOCHMAL</button>
          <button class="menu-button" onclick="backToMenu()">MENÜ</button>
        </div>
      </div>
      <div id="instructions" class="instructions d-none">
        <h2 class="instructions-title">SPIELANLEITUNG</h2>

        <div class="instruction-box controls-box">
          <h3>STEUERUNG</h3>
          <p>WASD / Pfeiltasten → Schwimmen</p>
          <p>E → Final Slap</p>
          <p>F → Blasenangriff</p>
        </div>

        <div class="instruction-box enemies-box">
          <h3>GEGNER</h3>
          <p>
            <img
              class="instruction-icon"
              src="img/2.Enemy/1.Puffer fish (3 color options)/1.Swim/1.swim1.png"
              alt="Kugelfisch"
            />Kugelfisch → Final Slap
          </p>
          <p>
            <img
              class="instruction-icon"
              src="img/2.Enemy/2 Jelly fish/Regular damage/Lila 1.png"
              alt="Qualle"
            />Qualle → Blasenangriff
          </p>
          <p>
            <img
              class="instruction-icon"
              src="img/2.Enemy/3 Final Enemy/2.floating/10.png"
              alt="Endboss"
            />
            Endboss → Blasenangriff
          </p>
        </div>

        <div class="instruction-box collect-box">
          <h3>SAMMELN</h3>
          <p>
            <img
              class="instruction-icon"
              src="img/4. Marcadores/1. Coins/1.png"
              alt="Münze"
            />
            Münzen einsammeln
          </p>
          <p>
            <img
              class="instruction-icon"
              src="img/4. Marcadores/Posión/Animada/1.png"
              alt="Giftflasche"
            />
            Gift für den Blasenangriff sammeln
          </p>
        </div>

        <button class="menu-button back-button" onclick="hideInstructions()">
          ZURÜCK
        </button>
      </div>

      <canvas id="canvas" width="720" height="480"></canvas>

      <div id="gameMenuButtons" class="game-menu-buttons d-none">
        <button
          class="game-icon-button"
          onclick="showInstructions()"
          aria-label="Spielanleitung öffnen"
        >
          ?
        </button>
        <button
          id="soundButton"
          class="game-icon-button"
          onclick="toggleSound()"
          aria-label="Ton ein- oder ausschalten"
        >
          🔊
        </button>
      </div>

      <div id="mobileControls" class="mobile-controls d-none">
        <div class="movement-controls">
          <button
            class="control-button up"
            aria-label="Nach oben schwimmen"
            onpointerdown="keyboard.UP = true"
            onpointerup="keyboard.UP = false"
            onpointerleave="keyboard.UP = false"
          >
            ▲
          </button>

          <button
            class="control-button left"
            aria-label="Nach links schwimmen"
            onpointerdown="keyboard.LEFT = true"
            onpointerup="keyboard.LEFT = false"
            onpointerleave="keyboard.LEFT = false"
          >
            ◀
          </button>

          <button
            class="control-button down"
            aria-label="Nach unten schwimmen"
            onpointerdown="keyboard.DOWN = true"
            onpointerup="keyboard.DOWN = false"
            onpointerleave="keyboard.DOWN = false"
          >
            ▼
          </button>

          <button
            class="control-button right"
            aria-label="Nach rechts schwimmen"
            onpointerdown="keyboard.RIGHT = true"
            onpointerup="keyboard.RIGHT = false"
            onpointerleave="keyboard.RIGHT = false"
          >
            ▶
          </button>
        </div>

        <div class="attack-controls">
          <button
            class="control-button attack-button"
            aria-label="Final Slap ausführen"
            onpointerdown="keyboard.E = true"
            onpointerup="keyboard.E = false"
            onpointerleave="keyboard.E = false"
          >
            👊
          </button>

          <button
            class="control-button attack-button"
            aria-label="Blasenangriff ausführen"
            onpointerdown="keyboard.F = true"
            onpointerup="keyboard.F = false"
            onpointerleave="keyboard.F = false"
          >
            🫧
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
